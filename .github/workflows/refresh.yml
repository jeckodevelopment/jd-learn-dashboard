name: Refresh JD Learn dashboard data
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jdlearn-dashboard-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update snapshot from source GitHub repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync.py
      - name: Validate generated JSON
        run: python -m json.tool data/snapshot.json >/dev/null && python -m json.tool data/requirements.json >/dev/null
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/requirements.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh JD Learn release status"
            git push
          fi
